<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="pve.css"><link rel="stylesheet" href="pmx.css">
<script>
window.gettext = x => x;
window.Proxmox = {NodeName:'test',UserName:'test@pam',defaultLang:'en',Setup:{auth_cookie_name:'PVEAuthCookie'}};
window.addEventListener('error', e => {
    document.getElementById('result').textContent += '\nERROR: ' + (e.error ? e.error.stack : e.message);
});
</script>
<script src="ext.js"></script><script src="charts.js"></script>
<script src="proxmoxlib.js"></script><script src="pve.js"></script>
<script src="local-thermal.js"></script>
</head><body><pre id="result">START</pre><div id="view"></div>
<script>
Ext.onReady(function () {
    try {
        Ext.state.Manager.setProvider(Ext.create('PVE.StateProvider'));
        Ext.state.Manager.set('GuiCap', {nodes:{'Sys.Modify':1}});
        const store = Ext.create('Proxmox.data.ObjectStore', {
            url:'/fixture-status', storeid:'test-node-status', interval:0,
        });
        const view = Ext.create('PVE.node.StatusView', {
            renderTo:'view', width:Number(new URLSearchParams(location.search).get('width')) || 770,
            rstore:store, pveSelNode:{data:{node:'test'}},
        });
        const sensors = {cpu:[{label:'Package id 0',value:81,max:84,crit:100}],
            cores:[0,1,2,3,4,5].map(i=>({label:'Core '+i,value:76+i,max:84,crit:100})),
            nvme:[{label:'nvme0 Composite',value:65.85,max:79.85,crit:84.85}],
            sata:[{label:'sda',value:51},{label:'sdb',value:54}],
            acpi:[{label:'ACPI zone',value:27.8}],fans:[],
            ecfan:{available:true,control_supported:true,mode:'normal',fan_rpm:3247,age_seconds:0}};
        const widgets = view.query('pmxInfoWidget').filter(w=>w.textField==='localthermal');
        const update = value => {
            const node = {localthermal:value,cpu:0.17,wait:0.01,loadavg:[1,1,1],uptime:86400,
                cpuinfo:{cpus:12,model:'Intel Core i5-10400',sockets:1,cores:6,mhz:'4000'},
                memory:{used:8e9,total:32e9},rootfs:{used:30e9,total:100e9},
                swap:{used:0,total:8e9},ksm:{shared:0},'boot-info':{mode:'efi'},
                kversion:'Linux 6.8.12-30-pve',pveversion:'8.4.19'};
            store.loadData(Object.entries(node).map(([key,value])=>({key,value})));
            view.updateValues(store, [], true);
        };
        if (widgets.length !== 6) throw Error('Expected six sensor widgets');
        update(sensors);
        if (!view.el.dom.textContent.includes('81°C') ||
            !view.el.dom.textContent.includes('3247 RPM')) throw Error('Sensor values missing');
        const cpu = widgets.find(w=>w.itemId==='local-thermal-cpu');
        if (!cpu.renderer({cpu:[{label:'<img onerror=x>',value:1}]}).includes('&lt;img')) {
            throw Error('Sensor labels are not escaped');
        }
        update({});
        if (!view.el.dom.textContent.includes('Unavailable') || view.el.dom.textContent.includes('81°C')) {
            throw Error('Missing readings leave stale values');
        }
        update(sensors);
        const normal = view.down('#local-fan-normal');
        const full = view.down('#local-fan-full-speed');
        if (!normal.disabled || full.disabled) throw Error('Current mode controls are incorrect');
        const requests = [];
        Proxmox.Utils.API2Request = request => requests.push(request);
        store.load = Ext.emptyFn;
        view.localFanSetMode('full-speed');
        view.localFanSetMode('full-speed');
        if (requests.length !== 1 || requests[0].method !== 'PUT' ||
            requests[0].params.mode !== 'full-speed' || !full.disabled || !normal.disabled) {
            throw Error('Pending control duplicated or did not disable buttons');
        }
        requests[0].success({result:{data:'UPID:test:fan'}});
        if (requests.length !== 2 || requests[1].method !== 'GET') throw Error('Missing async task check');
        requests[1].success({result:{data:{status:'stopped',exitstatus:'OK'}}});
        sensors.ecfan.mode='full-speed'; sensors.ecfan.fan_rpm=5300;
        update(sensors);
        if (normal.disabled || !full.disabled || !view.el.dom.textContent.includes('5300 RPM')) {
            throw Error('Successful readback was not displayed');
        }
        view.localFanSetMode('normal');
        requests[2].failure({htmlStatus:'<img onerror=bad()>network timeout'});
        if (view.el.dom.querySelector('img[onerror]') || !view.el.dom.textContent.includes('Update not confirmed')) {
            throw Error('Failure state missing or unescaped');
        }
        view.localFanSetMode('normal');
        requests[3].success({result:{data:'UPID:test:failed'}});
        requests[4].success({result:{data:{status:'stopped',exitstatus:'EC interface busy'}}});
        if (!view.el.dom.textContent.includes('Update failed: EC interface busy') || view.localFanBusy) {
            throw Error('Failed task leaves controls stuck');
        }
        view.localFanBusy=true;
        view.localFanPoll('UPID:test:timeout',Date.now()-1);
        if (view.localFanBusy || !view.el.dom.textContent.includes('Update not confirmed')) {
            throw Error('Task deadline did not end pending state');
        }
        Ext.state.Manager.set('GuiCap',{nodes:{}});
        view.localFanRefresh();
        if (!normal.disabled || !full.disabled) throw Error('Read-only user has controls');
        Ext.state.Manager.set('GuiCap',{nodes:{'Sys.Modify':1}});
        view.localFanReceived=Date.now()-16000;
        view.localFanRefresh();
        if (!normal.disabled || !full.disabled || !view.el.dom.textContent.includes('Reading expired')) {
            throw Error('Expired readings enable controls or remain current');
        }
        sensors.ecfan.mode='normal'; sensors.ecfan.fan_rpm=3247;
        view.localFanResult=null;
        update(sensors);
        const second = Ext.create('PVE.node.StatusView', {rstore:store,pveSelNode:{data:{node:'test'}}});
        if (view.query('pmxInfoWidget').length !== second.query('pmxInfoWidget').length ||
            second.query('pmxInfoWidget').filter(w=>w.textField==='localthermal').length !== 6) {
            throw Error('Duplicate widgets after reopening');
        }
        second.destroy();
        second.localFanFinish('late callback');
        second.localFanPoll('UPID:test:late', Date.now()+1000);
        document.getElementById('result').textContent = 'PASS: create, update, missing sensors, escaping, reopen, control task, duplicate prevention, failure, permissions, expiry';
    } catch(e) {
        document.getElementById('result').textContent = 'FAIL: ' + (e.stack || e);
    }
});
</script></body></html>
